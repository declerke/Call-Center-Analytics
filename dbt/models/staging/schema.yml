version: 2

models:
  - name: stg_satvicoder_daily
    description: Satvicoder daily aggregate KPIs — 1,251 rows of operational metrics normalised to consistent types
    columns:
      - name: day_index
        description: Sequential row index (surrogate time dimension)
        tests:
          - not_null
          - unique
      - name: incoming_calls
        description: Total incoming calls for the day
        tests:
          - not_null
      - name: answered_calls
        description: Number of calls answered
        tests:
          - not_null
      - name: abandoned_calls
        description: Number of calls abandoned before answer
        tests:
          - not_null
      - name: answer_rate_pct
        description: Answer rate as a percentage value (0–100)
        tests:
          - not_null
      - name: service_level_pct
        description: Percentage of calls answered within 20 seconds
        tests:
          - not_null
      - name: avg_answer_speed_secs
        description: Average answer speed in seconds
        tests:
          - not_null
      - name: avg_talk_duration_secs
        description: Average talk duration in seconds
        tests:
          - not_null
      - name: avg_waiting_time_secs
        description: Average waiting time in seconds
        tests:
          - not_null
      - name: source_centre
        description: Dataset origin tag
        tests:
          - not_null
          - accepted_values:
              values: ['satvicoder']

  - name: stg_pwc_calls
    description: Normalised PWC individual call records — 5,000 rows with agent, topic, and CSAT fields
    columns:
      - name: call_id
        description: Unique call identifier
        tests:
          - not_null
          - unique
      - name: agent
        description: Agent name
        tests:
          - not_null
      - name: call_date
        description: Date the call was placed
        tests:
          - not_null
      - name: topic
        description: Call topic category
        tests:
          - not_null
      - name: is_answered
        description: Whether the call was answered
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_resolved
        description: Whether the call was resolved
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: speed_of_answer_secs
        description: Seconds from call arrival to agent answer — NULL for unanswered calls
      - name: avg_talk_duration_secs
        description: Average talk duration in seconds — NULL for unanswered calls
      - name: satisfaction_rating
        description: Customer satisfaction score (1–5) — NULL when not rated or unanswered
      - name: source_centre
        description: Dataset origin tag
        tests:
          - not_null
          - accepted_values:
              values: ['pwc']
