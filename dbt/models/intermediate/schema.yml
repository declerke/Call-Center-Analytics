version: 2

models:
  - name: int_unified_calls
    description: Union of both call centre staging tables — 10,000 rows with source_centre dimension
    columns:
      - name: call_id
        description: Call identifier (unique within each source_centre)
        tests:
          - not_null
      - name: source_centre
        description: Dataset origin — satvicoder or pwc
        tests:
          - not_null
          - accepted_values:
              values: ['satvicoder', 'pwc']
      - name: agent
        description: Agent name
        tests:
          - not_null
      - name: topic
        description: Call topic
        tests:
          - not_null
      - name: is_answered
        description: Call answered flag
        tests:
          - not_null
      - name: is_resolved
        description: Call resolved flag
        tests:
          - not_null
